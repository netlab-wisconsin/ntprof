# ntprof task file:  sudo ntprof record -c examples/ntprof.ini
# Every key is optional; options given on the command line override this file.

[Workload]
;SESSION_NAME="nvme4n1"         ; one namespace (--session); default: all
IO_TYPE="read"                  ; read, write or both (--io-type); default: both
IO_SIZE="4K"                    ; only these sizes, e.g. "4K,128K" (--size); default: all
;MIN_IO_SIZE=4K                 ; or a range of sizes (overrides IO_SIZE)
;MAX_IO_SIZE=128K

[Profiling]
IS_ONLINE=true                  ; print a line per group every TIME_INTERVAL (false: --offline)
TIME_INTERVAL=1                 ; seconds (-i)
FREQUENCY=1000                  ; record one command in FREQUENCY (-s); use the same value on both sides
AGGREGATION=avg                 ; avg, min, max or dist (--aggregation)
BUFFER_SIZE=256                 ; MB of ring buffer for the records (at most 256)
;SPDK_HOST=/path/to/spdk_nvme_perf      ; the host runs in SPDK (--spdk-host)
;SPDK_TARGET=/path/to/nvmf_tgt          ; the target runs in SPDK (--spdk-target)

[Report]
ENABLE_LATENCY_DISTRIBUTION=true
ENABLE_THROUGHPUT=true
ENABLE_LATENCY_BREAKDOWN=true
ENABLE_QUEUE_LENGTH=true
ENABLE_COMPONENT_DETAIL=false   ; the components of each stage too (--detail)
SHOW_ALL_GROUPS=false           ; also groups with under 1 % of the records (--all-groups)
ENABLE_GROUP_BY_SIZE=true
ENABLE_GROUP_BY_TYPE=true
ENABLE_GROUP_BY_SESSION=true
QUEUE_TRACKING=estimate         ; estimate (Little's law) or exact (--exact-queues)
